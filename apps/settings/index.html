<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Settings</title><style>body{font-family:system-ui;margin:0;padding:24px;background:#10131a;color:white}.row{padding:16px;margin:10px 0;background:#1b202b;border-radius:12px}button{padding:10px 16px;border:0;border-radius:10px;margin:4px}</style></head><body><h1>⚙️ Settings</h1><div class="row">Appearance <button onclick="setTheme('dark')">Dark</button><button onclick="setTheme('light')">Light</button></div><div class="row">System: World OS 0.1.0</div><script>function setTheme(t){document.body.style.background=t==='light'?'#f4f4f4':'#10131a';document.body.style.color=t==='light'?'#111':'white';localStorage.setItem('worldos-theme',t)}</script></body></html>
