<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Browser</title><style>body{font-family:system-ui;margin:0;padding:24px;background:#10131a;color:white}input{width:70%;padding:14px;border-radius:12px;border:0;margin-right:8px}button{padding:14px 18px;border:0;border-radius:12px}#home{margin-top:30px}</style></head><body><h1>🌐 World Browser</h1><input id="url" placeholder="Search the web or enter an address"><button onclick="go()">Go</button><div id="home">Welcome to World Browser.</div><script>function go(){const v=document.getElementById('url').value.trim();if(v)document.getElementById('home').textContent='Opening: '+v}</script></body></html>
